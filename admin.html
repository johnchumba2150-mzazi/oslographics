<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Oslo Graphics Admin</title>
<style>body{font:16px/1.5 Arial,sans-serif;background:#f4efe7;color:#081222;margin:0;padding:16px 16px 80px}main{max-width:860px;margin:auto}details{background:#fff;border:1px solid #dfe2e5;margin:10px 0;padding:10px 14px}summary{font-weight:800;cursor:pointer;text-transform:capitalize}fieldset{border:1px solid #dfe2e5;margin:10px 0;padding:10px}legend{font-weight:800;text-transform:capitalize}.f{display:block;margin:10px 0}.f span{display:block;font-size:12px;font-weight:800;text-transform:capitalize;color:#555}.f input,.f textarea{width:100%;padding:10px;border:1px solid #c9ccd0;font:inherit;box-sizing:border-box}.f img{max-width:160px;max-height:100px;display:block;margin-bottom:6px;border-radius:3px}.it{border-left:4px solid #2d6dc4;padding-left:10px;margin:12px 0}button{padding:10px 16px;border:0;background:#163f7b;color:#fff;font-weight:800;cursor:pointer;margin:4px 4px 4px 0}button.x{background:#a33}#bar{position:fixed;left:0;right:0;bottom:0;background:#081222;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center}</style></head><body><main><h1>Oslo Graphics · Site Editor</h1>
<div id="login"><p>Sign in with the admin email.</p><label class="f"><input id="em" type="email" placeholder="Email" autocomplete="username"></label><label class="f"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"></label><button id="go">Sign in</button></div>
<div id="ed" hidden><p>Open a section, edit any text, or choose a file under an image to upload it. Use <b>+ Add</b> to add products, services or portfolio items. Press <b>Save</b> when done.</p><div id="form"></div><h2>Orders and sales</h2><div id="stats"></div><div id="orders"></div><h2>Quote requests</h2><div id="leads"></div></div></main>
<div id="bar"><button id="save" hidden>Save changes</button><button id="out" class="x" hidden>Sign out</button><span id="msg"></span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="content.js"></script><script src="admin.js"></script></body></html>
